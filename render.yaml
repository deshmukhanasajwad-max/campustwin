# Render Blueprint - New > Blueprint > pick this repo. Creates the database and the web service.
databases:
  - name: campustwin-db
    databaseName: campustwin
    user: campustwin
    plan: free

services:
  - type: web
    name: campustwin
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campustwin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "true"
